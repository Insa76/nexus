[project]
name = "bootstrap"
version = "0.1.0"
description = "NEXUS Bootstrap"
readme = "README.md"
authors = [
    { name = "diego", email = "dinsaurralde@yahoo.com.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "runtime",
    "tasks",
]

[project.scripts]
nexus = "bootstrap:main"

[tool.uv.sources]
runtime = { workspace = true }
tasks = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
