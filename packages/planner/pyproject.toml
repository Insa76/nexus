[project]
name = "planner"
version = "0.1.0"
description = "NEXUS Planner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memory",
    "context",
    "ollama>=0.6.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
memory = { workspace = true }
context = { workspace = true }
