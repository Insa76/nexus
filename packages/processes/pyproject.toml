[project]
name = "nexus-processes"
version = "0.1.0"
description = "NEXUS assistant processes subsystem"
requires-python = ">=3.12"
dependencies = [
    "nexus-context",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processes"]
