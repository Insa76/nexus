services:
  db:
    image: postgres:16-alpine
    container_name: security-platform-db
    environment:
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
      POSTGRES_DB: security_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: security-platform-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_data: