<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXUS Dev Console</title>

    <style>
        :root {
            --bg: #0b0f14;
            --panel: #111820;
            --panel-2: #151e28;
            --border: #263341;
            --text: #e7edf3;
            --muted: #8493a3;
            --accent: #55d6be;
            --danger: #ff6b6b;
            --warning: #f2c94c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #172330 0%,
                    var(--bg) 45%
                );

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .app {
            width: min(1400px, 94vw);
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--panel);

            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;

            font-size: 22px;
            letter-spacing: 0.04em;
        }

        .subtitle {
            margin-top: 4px;

            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 12px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--panel);

            font-size: 13px;
            color: var(--muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;
            background: var(--accent);

            box-shadow:
                0 0 12px rgba(85, 214, 190, 0.7);
        }

        .workspace {
            display: grid;

            grid-template-columns:
                minmax(320px, 0.75fr)
                minmax(500px, 1.25fr);

            gap: 20px;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 16px;

            background:
                linear-gradient(
                    180deg,
                    rgba(21, 30, 40, 0.96),
                    rgba(11, 15, 20, 0.96)
                );

            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 18px;

            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .panel-meta {
            color: var(--muted);
            font-size: 12px;
        }

        .panel-body {
            padding: 18px;
        }

        textarea {
            width: 100%;
            min-height: 130px;

            resize: vertical;

            padding: 15px;

            border: 1px solid var(--border);
            border-radius: 12px;

            outline: none;

            background: #0b1016;
            color: var(--text);

            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 10px;

            margin-top: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;

            padding: 11px 18px;

            cursor: pointer;

            font-weight: 700;
            font-size: 14px;
        }

        .primary {
            background: var(--accent);
            color: #07110f;
        }

        .secondary {
            background: var(--panel-2);
            color: var(--text);

            border: 1px solid var(--border);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .conversation {
            margin-top: 18px;

            display: flex;
            flex-direction: column;
            gap: 10px;

            max-height: 430px;
            overflow-y: auto;
        }

        .message {
            padding: 12px 14px;

            border-radius: 12px;

            border: 1px solid var(--border);

            white-space: pre-wrap;
        }

        .message.user {
            background: #111a23;
        }

        .message.nexus {
            background: #0c1517;
        }

        .message-label {
            margin-bottom: 5px;

            color: var(--muted);

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .message-content {
            font-family:
                "Cascadia Code",
                "Consolas",
                monospace;

            font-size: 13px;
            line-height: 1.55;
        }

        .trace {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trace-step {
            padding: 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: rgba(11, 16, 22, 0.8);
        }

        .trace-step.success {
            border-left: 3px solid var(--accent);
        }

        .trace-step.error {
            border-left: 3px solid var(--danger);
        }

        .trace-step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .trace-name {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .trace-icon {
            color: var(--accent);
        }

        .trace-error {
            color: var(--danger);
        }

        .trace-data {
            margin: 0;

            max-height: 220px;
            overflow: auto;

            color: #b9c6d2;

            font-family:
                "Cascadia Code",
                "Consolas",
                monospace;

            font-size: 12px;
            line-height: 1.5;

            white-space: pre-wrap;
        }

        .empty {
            padding: 30px 10px;

            text-align: center;

            color: var(--muted);
            font-size: 13px;
        }

        .memory-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 14px;
            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: #0c1218;
        }

        .memory-label {
            color: var(--muted);
            font-size: 12px;
        }

        .memory-value {
            font-family:
                "Cascadia Code",
                "Consolas",
                monospace;

            color: var(--accent);
            font-size: 13px;
        }

        .footer {
            margin-top: 18px;

            color: var(--muted);

            text-align: center;

            font-size: 11px;
        }

        @media (max-width: 900px) {

            .workspace {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <div class="logo">
                NX
            </div>

            <div>
                <h1>NEXUS Dev Console</h1>

                <div class="subtitle">
                    Cognitive OS · Development Environment
                </div>
            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            <span id="statusText">
                NEXUS online
            </span>

        </div>

    </header>


    <main class="workspace">

        <!-- LEFT -->

        <section class="panel">

            <div class="panel-header">

                <div class="panel-title">
                    Console
                </div>

                <div
                    class="panel-meta"
                    id="memoryHeader"
                >
                    Memory: 0
                </div>

            </div>


            <div class="panel-body">

                <textarea
                    id="command"
                    placeholder="Escribí una instrucción para NEXUS..."
                ></textarea>


                <div class="actions">

                    <button
                        id="executeButton"
                        class="primary"
                    >
                        Ejecutar
                    </button>

                    <button
                        id="clearButton"
                        class="secondary"
                    >
                        Limpiar
                    </button>

                </div>


                <div
                    id="conversation"
                    class="conversation"
                >

                    <div class="empty">
                        Todavía no hay ejecuciones.
                    </div>

                </div>


                <div class="memory-bar">

                    <span class="memory-label">
                        WorkingMemory
                    </span>

                    <span
                        id="memoryValue"
                        class="memory-value"
                    >
                        0 entries
                    </span>

                </div>

            </div>

        </section>


        <!-- RIGHT -->

        <section class="panel">

            <div class="panel-header">

                <div class="panel-title">
                    Execution Trace
                </div>

                <div
                    class="panel-meta"
                    id="traceStatus"
                >
                    Esperando ejecución
                </div>

            </div>


            <div class="panel-body">

                <div
                    id="trace"
                    class="trace"
                >

                    <div class="empty">
                        Ejecutá una instrucción para
                        visualizar el recorrido interno
                        de NEXUS.
                    </div>

                </div>

            </div>

        </section>

    </main>


    <div class="footer">
        NEXUS Development Environment
    </div>

</div>


<script>

const commandInput =
    document.getElementById("command");

const executeButton =
    document.getElementById("executeButton");

const clearButton =
    document.getElementById("clearButton");

const conversation =
    document.getElementById("conversation");

const traceContainer =
    document.getElementById("trace");

const traceStatus =
    document.getElementById("traceStatus");

const memoryHeader =
    document.getElementById("memoryHeader");

const memoryValue =
    document.getElementById("memoryValue");

const statusText =
    document.getElementById("statusText");


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function pretty(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "null";
    }

    if (
        typeof value === "string"
    ) {
        return value;
    }

    return JSON.stringify(
        value,
        null,
        2
    );
}


function addMessage(
    type,
    content
) {

    const empty =
        conversation.querySelector(
            ".empty"
        );

    if (empty) {
        empty.remove();
    }

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    const label =
        type === "user"
            ? "Usuario"
            : "NEXUS";

    message.innerHTML = `
        <div class="message-label">
            ${label}
        </div>

        <div class="message-content">
            ${escapeHtml(content)}
        </div>
    `;

    conversation.appendChild(
        message
    );

    conversation.scrollTop =
        conversation.scrollHeight;
}


function renderTrace(trace) {

    traceContainer.innerHTML = "";

    const steps = [
        {
            key: "request",
            label: "Request",
        },
        {
        key: "context",
        label: "Cognitive Context",
        },
        {
            key: "intent",
            label: "Intent",
        },
        {
            key: "objective",
            label: "Objective",
        },
        {
            key: "plan",
            label: "Plan",
        },
        {
            key: "plan_final",
            label: "Final Plan",
        },
        {
            key: "result",
            label: "Runtime / Result",
        },
        {
            key: "error",
            label: "Error",
        },
    ];


    let rendered = 0;


    for (const step of steps) {

        const data =
            trace?.[step.key];

        if (
            data === null ||
            data === undefined
        ) {
            continue;
        }

        rendered++;

        const isError =
            step.key === "error";

        const element =
            document.createElement("div");

        element.className =
            `trace-step ${
                isError
                    ? "error"
                    : "success"
            }`;

        element.innerHTML = `
            <div class="trace-step-header">

                <div class="trace-name">

                    <span
                        class="${
                            isError
                                ? "trace-error"
                                : "trace-icon"
                        }"
                    >
                        ${
                            isError
                                ? "✕"
                                : "✓"
                        }
                    </span>

                    ${step.label}

                </div>

            </div>

            <pre class="trace-data">${escapeHtml(
                pretty(data)
            )}</pre>
        `;

        traceContainer.appendChild(
            element
        );
    }


    if (!rendered) {

        traceContainer.innerHTML = `
            <div class="empty">
                No hay datos de ejecución.
            </div>
        `;

        traceStatus.textContent =
            "Sin datos";

        return;
    }


    traceStatus.textContent =
        `${rendered} etapas`;
}


async function execute() {

    const text =
        commandInput.value.trim();

    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    commandInput.value = "";

    executeButton.disabled = true;

    executeButton.textContent =
        "Ejecutando...";

    traceStatus.textContent =
        "Ejecutando";


    try {

        const response =
            await fetch(
                "/api/execute",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                    },

                    body: JSON.stringify({
                        text,
                    }),
                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            addMessage(
                "nexus",
                pretty(data.output)
            );

        } else {

            addMessage(
                "nexus",
                data.message ||
                    "NEXUS devolvió un error."
            );
        }


        if (data.trace) {

            renderTrace(
                data.trace
            );
        }


        const memory =
            data.memory_count ?? 0;

        memoryHeader.textContent =
            `Memory: ${memory}`;

        memoryValue.textContent =
            `${memory} entries`;


    } catch (error) {

        addMessage(
            "nexus",
            `Error de conexión: ${error.message}`
        );

        traceStatus.textContent =
            "Error";


    } finally {

        executeButton.disabled = false;

        executeButton.textContent =
            "Ejecutar";
    }
}


async function loadStatus() {

    try {

        const response =
            await fetch(
                "/api/status"
            );

        const data =
            await response.json();


        if (
            data.status === "online"
        ) {

            statusText.textContent =
                "NEXUS online";

        }

        const memory =
            data.memory ?? 0;

        memoryHeader.textContent =
            `Memory: ${memory}`;

        memoryValue.textContent =
            `${memory} entries`;


    } catch {

        statusText.textContent =
            "NEXUS offline";
    }
}


executeButton.addEventListener(
    "click",
    execute
);


clearButton.addEventListener(
    "click",
    () => {

        conversation.innerHTML = `
            <div class="empty">
                Todavía no hay ejecuciones.
            </div>
        `;

        traceContainer.innerHTML = `
            <div class="empty">
                Ejecutá una instrucción para
                visualizar el recorrido interno
                de NEXUS.
            </div>
        `;

        traceStatus.textContent =
            "Esperando ejecución";
    }
);


commandInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter" &&
            (event.ctrlKey || event.metaKey)
        ) {

            execute();
        }
    }
);


loadStatus();

</script>

</body>
</html>
